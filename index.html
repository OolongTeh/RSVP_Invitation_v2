
<!-- /* Upon confirmation of the final list of the guests attending, deploy the Count Down page below */ -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Save the Date!</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Cormorant+Garamond:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --sakura-pink-light: #fce4ec;
            --sakura-pink-medium: #ffb6c1;
            --sakura-pink-deep: #e91e63;
            --elegant-maroon: #7a001f;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Libre Baskerville', serif; 
            background-image: url('https://wallpapers.com/images/hd/romantic-sakura-tree-pathway-ef9wtrc3634biz0h.webp');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.4); 
            z-index: -1;
        }
        
        .petal {
            position: fixed;
            width: 15px; height: 15px;
            background: radial-gradient(ellipse at center, var(--sakura-pink-medium) 0%, var(--sakura-pink-light) 100%);
            border-radius: 50% 0 50% 0;
            opacity: 0.6;
            pointer-events: none;
            animation: fall linear infinite;
            z-index: 1000;
        }

        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 0.7; }
            100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
        }

        .container {
            max-width: 600px;
            width: 100%;
            background: white;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.1);
            overflow: hidden;
            animation: fadeIn 0.8s ease-out;
            z-index: 1;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- LANDING PAGE STYLES --- */
        #landingPage {
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 50px 30px;
            text-align: center;
            background: #fdfaf7; 
            min-height: 400px;
        }

        .letter-container {
            border: 2px solid var(--sakura-pink-medium); 
            padding: 40px;
            border-radius: 10px;
            background: #ffffff;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            max-width: 450px;
            opacity: 0;
            animation: letterArrive 1.5s ease-out forwards;
            animation-delay: 0.5s;
            z-index: 2;
        }
        
        @keyframes letterArrive {
            0% { transform: translate(-50%, 100vh); opacity: 0; filter: blur(10px); }
            100% { transform: translate(-50%, -50%); opacity: 1; filter: blur(0px); }
        }

        .letter-container.animate-open { animation: letterOpen 0.8s ease-out forwards; }

        @keyframes letterOpen {
            100% { transform: translate(-50%, -150%) scale(0.5); opacity: 0; }
        }

        #landingPage h2 {
            font-family: 'Cormorant Garamond', serif; 
            font-size: 2em; 
            color: var(--sakura-pink-deep); 
            letter-spacing: 2px;
        }
        
        /* --- Wax Seal Button --- */
        #revealButton {
            width: 99px; height: 99px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, var(--sakura-pink-deep) 0%, #d81b60 60%, var(--elegant-maroon) 100%);
            color: white; border: none;
            font-size: 0.75em; font-weight: bold;
            text-transform: uppercase;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
            cursor: pointer;
            position: absolute;
            bottom: 60px; left: 50%;
            transform: translateX(-50%);
            z-index: 3;
            display: flex; justify-content: center; align-items: center;
            opacity: 0;
            animation: sealFadeIn 1s ease-out forwards;
            animation-delay: 2.5s;
            clip-path: polygon(50% 0%, 80% 10%, 100% 30%, 90% 60%, 100% 80%, 70% 100%, 30% 95%, 0% 85%, 10% 50%, 0% 20%, 20% 0%);
        }

        #revealButton::after {
            content: 'C & C';
            font-family: 'Playfair Display', serif;
            font-size: 2.2em;
            color: rgba(255,255,255,0.7);
            mix-blend-mode: overlay;
        }

        @keyframes sealFadeIn {
            from { opacity: 0; transform: translateX(-50%) translateY(20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        /* --- COUNTDOWN PAGE STYLES --- */
        .header {
            background: linear-gradient(135deg, var(--sakura-pink-medium) 0%, var(--sakura-pink-deep) 100%);
            padding: 40px 20px;
            text-align: center;
        }

        .header-image {
            width: 150px; height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 5px solid white;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .solemnization-names {
            font-family: 'Alex Brush', cursive; 
            font-size: 2.2em;
            color: white; 
            margin: 15px 0;
        }

        .countdown-section {
            padding: 30px;
            text-align: center;
        }

        .final-celebration-photo {
            width: 100%; max-width: 300px;
            border-radius: 15px;
            border: 5px solid white;
            margin: 20px auto;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        .countdown-timer {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin: 25px 0;
        }

        .time-unit {
            background: #fff;
            padding: 15px 5px;
            border-radius: 8px;
            border: 1px solid var(--sakura-pink-light);
        }

        .time-number {
            display: block;
            font-family: 'Playfair Display', serif; 
            color: var(--sakura-pink-deep);
            font-size: 1.8em;
            font-weight: 700;
        }

        .time-label { font-size: 0.7em; color: #777; text-transform: uppercase; }

        .event-reminder {
            text-align: left;
            padding: 20px;
            background-color: #f9f9f9;
            border-left: 4px solid var(--sakura-pink-deep);
            border-radius: 5px;
            font-size: 0.95em;
            line-height: 1.6;
        }

        .event-reminder h3 { color: var(--sakura-pink-deep); margin-bottom: 8px; }

        @media (max-width: 480px) {
            .countdown-timer { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- STEP 1: Landing Letter -->
        <div id="landingPage">
            <div class="letter-container">
                <h2>A Special Delivery</h2>
            </div>
            <button id="revealButton"></button>
        </div>

        <!-- STEP 2: The Main Reveal (Countdown) -->
        <div id="mainContent" style="display: none;">
            <div class="header">
                <img src="https://github.com/OolongTeh/RSVP_Invitation_v2/blob/main/Gemini_Generated_Image_f3wnvcf3wnvcf3wn.png?raw=true" alt="Carrie & Chun Wei" class="header-image">
                <p class="solemnization-names">Carrie & Chun Wei</p> 
                <h1 style="color: white; font-family: 'Playfair Display'; font-size: 1.2em; font-weight: normal;">We can't wait to see you!</h1>
            </div>

            <div class="countdown-section">
                <h3 style="font-family: 'Alex Brush'; font-size: 2.2em; color: var(--sakura-pink-deep);">Counting down to our day</h3>
                
                <div class="countdown-timer">
                    <div class="time-unit">
                        <span class="time-number" id="days">00</span>
                        <span class="time-label">Days</span>
                    </div>
                    <div class="time-unit">
                        <span class="time-number" id="hours">00</span>
                        <span class="time-label">Hours</span>
                    </div>
                    <div class="time-unit">
                        <span class="time-number" id="minutes">00</span>
                        <span class="time-label">Mins</span>
                    </div>
                    <div class="time-unit">
                        <span class="time-number" id="seconds">00</span>
                        <span class="time-label">Secs</span>
                    </div>
                </div>

                <div class="event-reminder">
                    <h3>📅 Save the Date</h3>
                    <p><strong>Wednesday, 20 May 2026</strong><br>
                    4:00 PM - 5:00 PM<br>
                    Ficus Room, Gardens by the Bay</p>
                </div>

                <img src="https://github.com/OolongTeh/RSVP_Invitation_v2/blob/main/Image%20(4).jpg?raw=true" alt="Carrie and Chun Wei" class="final-celebration-photo">
                
                <div style="color: var(--sakura-pink-deep); margin-top: 20px;">♥ ♥ ♥</div>
            </div>
        </div>
    </div>

    <script>
        const landingPage = document.getElementById('landingPage');
        const mainContent = document.getElementById('mainContent');
        const revealButton = document.getElementById('revealButton');
        const letterContainer = document.querySelector('.letter-container');

        // Target Date
        const targetDate = new Date('2026-05-20T16:00:00').getTime();

        // Reveal Logic
        revealButton.addEventListener('click', () => {
            letterContainer.classList.add('animate-open');
            revealButton.style.opacity = 0;

            setTimeout(() => {
                landingPage.style.display = 'none'; 
                mainContent.style.display = 'block';
                startCountdown();
            }, 800); 
        });

        // Countdown Logic
        function updateCountdown() {
            const now = new Date().getTime();
            const distance = targetDate - now;

            if (distance > 0) {
                const days = Math.floor(distance / (1000 * 60 * 60 * 24));
                const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((distance % (1000 * 60)) / 1000);

                document.getElementById('days').textContent = String(days).padStart(2, '0');
                document.getElementById('hours').textContent = String(hours).padStart(2, '0');
                document.getElementById('minutes').textContent = String(minutes).padStart(2, '0');
                document.getElementById('seconds').textContent = String(seconds).padStart(2, '0');
            }
        }

        function startCountdown() {
            updateCountdown();
            setInterval(updateCountdown, 1000);
        }

        // Sakura Petals
        function createPetals() {
            const petalCount = 30;
            for (let i = 0; i < petalCount; i++) {
                const petal = document.createElement('div');
                petal.className = 'petal';
                petal.style.left = Math.random() * 100 + '%';
                petal.style.animationDuration = (Math.random() * 10 + 10) + 's';
                petal.style.animationDelay = Math.random() * 5 + 's';
                document.body.appendChild(petal);
            }
        }

        window.addEventListener('load', createPetals);
    </script>
</body>
</html>
